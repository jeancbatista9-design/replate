async function startBarcodeCamera(){scanMsg='';if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanMsg='Camera access is not available here. Try the manual barcode box below.';render();return}if(!('BarcodeDetector' in window)){scanMsg='This browser can open the camera but cannot automatically read barcodes. Try Chrome/Android or enter the barcode below.';render();return}try{stopBarcodeCamera();scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});const area=document.getElementById('cameraArea');if(!area){stopBarcodeCamera();return}area.innerHTML=`<div class="cameraBox"><video id="barcodeVideo" playsinline autoplay></video><div class="cameraFrame"><div class="cameraLine"></div></div><div class="cameraHint">Hold the barcode inside the green box</div></div><button style="width:100%" onclick="stopBarcodeCamera();render()">Close Camera</button>`;const v=document.getElementById('barcodeVideo');v.srcObject=scanStream;await v.play();const supported=await BarcodeDetector.getSupportedFormats(),wanted=['ean_13','ean_8','upc_a','upc_e'].filter(x=>supported.includes(x)),detector=new BarcodeDetector(wanted.length?{formats:wanted}:undefined);let working=false;scanLoop=setInterval(async()=>{if(working||!scanStream||v.readyState<2)return;working=true;try{const codes=await detector.detect(v);if(codes.length){const code=codes[0].rawValue;stopBarcodeCamera();await lookupBarcode(code)}}catch(e){}finally{working=false}},350)}catch(e){scanMsg=(location.protocol!='https:'&&location.hostname!='localhost')?'Camera scanning needs the app to be opened from an HTTPS website. You can still enter a barcode manually below.':'Camera permission was not granted or the camera could not be opened. You can enter a barcode manually below.';render()}}

const VS=[{id:'s1',e:'🍝',t:'15-minute garlic butter pasta',by:'@chefmaya',tag:'Recipe',c:'#65A30D,#ff3b4e'},{id:'s2',e:'🥖',t:"Fresh sourdough daily at Rosa's Bakery",by:'@rosasbakery',tag:'Business',c:'#c77700,#7a4a00'},{id:'s3',e:'🥗',t:'Use up your veggies: 5-minute salad',by:'@greenplate',tag:'Recipe',c:'#15803D,#0b6b46'},{id:'s4',e:'🌮',t:'Taco Tuesday at La Esquina food truck',by:'@laesquina',tag:'Business',c:'#e8381f,#8f1d0e'},{id:'s5',e:'🍲',t:'Leftover soup that tastes brand new',by:'@zerowastekitchen',tag:'Tip',c:'#6a4cff,#3b2a9e'}];
let VUP=null,VF=null,VM=true,VL={};
const vdb=()=>new Promise((ok,no)=>{const r=indexedDB.open('reseat-vid',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const vput=(k,b)=>vdb().then(d=>new Promise((ok,no)=>{const t=d.transaction('v','readwrite');t.objectStore('v').put(b,k);t.oncomplete=ok;t.onerror=()=>no(t.error)}));
const vget=k=>vdb().then(d=>new Promise(ok=>{const q=d.transaction('v').objectStore('v').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})).catch(()=>null);
function vidv(){const pr=!!S.premium,L=S.likes||[];
return `<div class="vh"><div><h1 style="margin:0">Watch</h1><div class="mu">Recipes, tips and local food businesses</div></div><button class="s ${pr?'p':''}" onclick="vUp()">${pr?'＋ Upload':'🔒 Upload'}</button></div><div class="vf" id="vf">${[...(S.myv||[]),...VS].map(v=>`<div class="vi" style="background:linear-gradient(160deg,${v.c||'#2b2b2b,#555'})">${v.u?`<video playsinline loop ${VM?'muted':''} preload="metadata" data-v="${v.id}" onclick="this.paused?this.play():this.pause()"></video>`:`<div class="ve">${v.e}</div>`}<div class="vs"><button onclick="vLike('${v.id}',this)">${L.includes(v.id)?'❤️':'🤍'}</button><button class="vm" onclick="vMute()">${VM?'🔇':'🔊'}</button></div><div class="vo"><span class="tag" style="background:rgba(255,255,255,.2)">${esc(v.tag)}${v.u?'':' · sample'}</span><div style="font-weight:800;font-size:18px;margin-top:6px">${esc(v.t)}</div><div style="opacity:.85;font-size:13px">${esc(v.by)}</div></div></div>`).join('')}</div>${VUP?vsheet():''}`}
function vsheet(){const c=`onclick="if(event.target==this)vClose()"`;
if(!S.premium)return `<div class="vsh" ${c}><div><h2 style="margin-top:0">⭐ Premium creators</h2><p class="mu">Everyone can watch. Premium members can post videos to promote their restaurant, business or recipes.</p><p>✔ Upload your own videos<br>✔ Get seen by the RePlate community<br>✔ Creator badge on your posts</p><button class="p" style="width:100%" onclick="vPrem(1)">Unlock Premium (demo)</button><button style="width:100%;margin-top:8px" onclick="vClose()">Not now</button></div></div>`;
return `<div class="vsh" ${c}><div><h2 style="margin-top:0">Post a video</h2><input type="file" id="vfile" accept="video/*" onchange="VF=this.files[0]"><input type="text" id="vcap" maxlength="80" placeholder="Title, e.g. My 10-minute ramen"><select id="vtag"><option>Recipe</option><option>Business</option><option>Tip</option></select><div class="chk" id="vmsg"></div><button class="p" style="width:100%" onclick="vPost()">Post</button><button style="width:100%;margin-top:8px" onclick="vClose()">Cancel</button><div class="mu" style="text-align:center;margin-top:10px" onclick="vPrem(0)">Switch back to free (demo)</div></div></div>`}
function vUp(){VUP=1;render()}function vClose(){VUP=null;VF=null;render()}function vPrem(on){S.premium=!!on;if(!on)VUP=null;save();render()}
function vLike(id,b){S.likes=S.likes||[];const i=S.likes.indexOf(id);i<0?S.likes.push(id):S.likes.splice(i,1);save();b.textContent=i<0?'❤️':'🤍'}
function vMute(){VM=!VM;document.querySelectorAll('.vi video').forEach(v=>v.muted=VM);document.querySelectorAll('.vm').forEach(b=>b.textContent=VM?'🔇':'🔊')}
async function vPost(){const m=$('vmsg');if(!S.premium)return;const t=$('vcap').value.trim();if(!VF)return m.textContent='Choose a video first.';if(!t)return m.textContent='Add a title.';if(VF.size>60e6)return m.textContent='Max 60 MB for now.';
try{const id='u'+Date.now();await vput(id,VF);(S.myv=S.myv||[]).unshift({id,u:1,t,tag:$('vtag').value,by:'@'+(S.user.username||S.user.name)});save();VUP=null;VF=null;render()}catch(e){m.textContent='Could not save that video. Try a smaller one.'}}
function vidInit(){const f=$('vf');if(!f)return;const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(!v)return;e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{root:f,threshold:.7});
f.querySelectorAll('.vi').forEach(el=>{io.observe(el);const v=el.querySelector('video');if(v){const k=v.dataset.v;(VL[k]?Promise.resolve(VL[k]):vget(k).then(b=>b?(VL[k]=URL.createObjectURL(b)):null)).then(u=>{if(u)v.src=u})}})}
const _rn=render;render=function(){_rn();if(tab=='vid')vidInit()};
</script><script>var rv=0;function revealApp(){if(rv)return;rv=1;try{LV="";TK=-2;render()}catch(x){}}function endSplash(){revealApp();var e=document.getElementById("splash");if(e)e.remove()}setTimeout(revealApp,3000);setTimeout(endSplash,3450)</script></body></html>
